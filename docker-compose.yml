# Production-shaped stack: the app, PostgreSQL, and (optionally) a local mail catcher.
#
#   cp .env.example .env        # then fill in the required values
#   docker compose up --build
#   open http://localhost:8000
#
# With the dev mail catcher (alerts and password-reset emails show up at http://localhost:8025):
#   docker compose --profile dev up --build
services:
  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://cybershield:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cybershield
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (32+ random characters)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybershield
      POSTGRES_USER: cybershield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield -d cybershield"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"   # web inbox
    # Point the app at it with: SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_SECURITY=none SMTP_FROM=alerts@cybershield.local

volumes:
  pgdata:
